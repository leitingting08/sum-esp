[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ===== 关键修改 =====
; USB模式配置
build_flags = 
    -D ARDUINO_USB_MODE=1           ; 启用USB OTG模式
    -D ARDUINO_USB_CDC_ON_BOOT=0    ; 改为0！关闭CDC on boot

; 上传配置
upload_speed = 115200               ; 降低波特率（从921600改为115200）
upload_protocol = esptool           ; 明确指定上传工具

; 串口监视器配置
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_dtr = 0                     ; 禁用DTR
monitor_rts = 0                     ; 禁用RTS

; 依赖库
lib_deps = 
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.3
    adafruit/Adafruit BusIO@^1.14.1
    miguelbalboa/MFRC522@^1.4.10
    fastled/FastLED@3.5.0    ; 改成3.5.0版本

; ========== 重点：选择要编译的文件 ==========
; 默认编译 oled.cpp，测试OLED
build_src_filter = 
    -<oled.cpp>
    -<rc522.cpp>
    -<rc522_read_card.cpp>
    -<led_strip.cpp>
    +<main.cpp>
